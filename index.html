<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Tracker Monitor</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --primary: #2563eb;
      --secondary: #10b981;
      --dark: #1e293b;
      --light: #f1f5f9;
      --sidebar-width: 320px;
      --header-height: 60px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--light);
      overflow: hidden;
    }
    @supports (height: 100dvh) { body { overflow: hidden; } }

    .header {
      background: linear-gradient(135deg, var(--primary) 0%, #1e40af 100%);
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1000;
    }
    .header h1 {
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 i { font-size: 1.4rem; }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }
    .status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 2s infinite;
    }
    .status-dot.connected { background: var(--secondary); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    .container {
      display: flex;
      height: calc(100dvh - var(--header-height));
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: white;
      box-shadow: 2px 0 10px rgba(0,0,0,0.08);
      overflow-y: auto;
      padding: 16px;
      z-index: 100;
      position: relative;
    }
    .sidebar-close {
      display: none;
      position: absolute;
      top: 10px; right: 10px;
      width: 32px; height: 32px;
      border: none; background: #e2e8f0;
      border-radius: 50%;
      cursor: pointer; font-size: 1rem;
      color: var(--dark);
      align-items: center; justify-content: center;
    }
    .sidebar-close:hover { background: #cbd5e1; }

    .info-card {
      background: var(--light);
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 10px;
      border-left: 3px solid var(--primary);
    }
    .info-label {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .info-value {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--dark);
      font-family: 'Courier New', monospace;
    }
    .info-unit {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 400;
      margin-left: 3px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 15px;
    }
    .stat-item {
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value { font-size: 1.2rem; font-weight: 700; }
    .stat-label { font-size: 0.7rem; opacity: 0.95; }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 600;
      margin: 18px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .map-wrapper { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    .map-controls {
      position: absolute;
      top: 12px; right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }
    .map-btn {
      width: 40px; height: 40px;
      border-radius: 8px; border: none;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--dark);
      transition: all 0.2s;
    }
    .map-btn:hover {
      background: var(--primary);
      color: white;
      transform: scale(1.05);
    }

    .floating-status {
      position: absolute;
      bottom: 12px; left: 12px;
      background: white;
      padding: 10px 16px;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
    }
    .floating-status i { color: var(--primary); }
    .status-label { color: #64748b; }
    .status-value { font-weight: 600; color: var(--dark); }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: var(--light);
      color: var(--dark);
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #e2e8f0; }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: #1d4ed8; }

    #connectedNotice {
      display: none;
      border-left-color: var(--secondary) !important;
      background: #ecfdf5;
    }
    #connectedNotice .info-value { color: var(--secondary); }

    /* Pulse animation untuk marker */
    .gps-marker {
      background: #2563eb;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(37, 99, 235, 0.7);
      animation: pulse-marker 2s infinite;
    }
    @keyframes pulse-marker {
      0% {
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
      }
      70% {
        box-shadow: 0 0 0 10px rgba(37, 99, 235, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
      }
    }

    @media (max-width: 768px) {
      .header { padding: 10px 15px; }
      .header h1 { font-size: 1.1rem; }
      .connection-status { padding: 4px 10px; font-size: 0.75rem; }
      :root { --header-height: 50px; }
      .sidebar {
        position: fixed;
        top: var(--header-height);
        left: -100%;
        width: 85%;
        max-width: 300px;
        height: calc(100dvh - var(--header-height));
        z-index: 2000;
        transition: left 0.3s ease;
        padding-top: 40px;
      }
      .sidebar.open { left: 0; }
      .sidebar-close { display: flex; }
      .sidebar::after {
        content:''; position:fixed;
        inset:0; background:rgba(0,0,0,0.3);
        z-index:-1; opacity:0; pointer-events:none;
        transition:opacity 0.3s;
      }
      .sidebar.open::after { opacity:1; pointer-events:auto; }
      .map-controls { top:8px; right:8px; }
      .map-btn { width:36px; height:36px; font-size:1rem; }
      .floating-status {
        bottom:8px; left:8px; right:8px;
        padding:8px 12px; font-size:0.8rem;
        justify-content:space-around;
      }
      .btn { padding:8px; font-size:0.8rem; }
      .stats-row { gap: 6px; }
      .stat-item { padding: 10px; }
      .stat-value { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fas fa-satellite"></i> GPS Tracker</h1>
    <div class="connection-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Menunggu koneksi...</span>
    </div>
  </div>

  <div class="container">
    <div class="sidebar" id="sidebar">
      <button class="sidebar-close" id="btnCloseSidebar" aria-label="Tutup panel">
        <i class="fas fa-times"></i>
      </button>

      <div class="info-card" id="connectedNotice">
        <div class="info-label"><i class="fas fa-check-circle"></i> Status</div>
        <div class="info-value">● Terhubung ke ESP32</div>
      </div>

      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-value" id="statSat">0</div>
          <div class="stat-label">Satelit</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statSpeed">0</div>
          <div class="stat-label">km/jam</div>
        </div>
      </div>

      <div class="section-title"><i class="fas fa-map-marker-alt"></i> Lokasi</div>
      <div class="info-card">
        <div class="info-label"><i class="fas fa-arrows-alt-h"></i> Latitude</div>
        <div class="info-value" id="lat"><span class="info-unit">Menunggu data...</span></div>
      </div>
      <div class="info-card">
        <div class="info-label"><i class="fas fa-arrows-alt-v"></i> Longitude</div>
        <div class="info-value" id="lng"><span class="info-unit">Menunggu data...</span></div>
      </div>
      <div class="info-card">
        <div class="info-label"><i class="fas fa-mountain"></i> Altitude</div>
        <div class="info-value">
          <span id="altitude">0</span><span class="info-unit">meter</span>
        </div>
      </div>

      <div class="section-title"><i class="fas fa-tachometer-alt"></i> Pergerakan</div>
      <div class="info-card">
        <div class="info-label"><i class="fas fa-compass"></i> Arah</div>
        <div class="info-value">
          <span id="direction">0</span><span class="info-unit">°</span>
        </div>
      </div>
      <div class="info-card">
        <div class="info-label"><i class="fas fa-clock"></i> Update Terakhir</div>
        <div class="info-value" id="lastUpdate" style="font-size:0.95rem">--:--:--</div>
      </div>

      <div class="section-title"><i class="fas fa-bullseye"></i> Akurasi</div>
      <div class="info-card">
        <div class="info-label"><i class="fas fa-signal"></i> HDOP</div>
        <div class="info-value">
          <span id="hdop">0.0</span><span class="info-unit">m</span>
        </div>
      </div>

      <div class="section-title"><i class="fas fa-cog"></i> Kontrol</div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnCenter">
          <i class="fas fa-crosshairs"></i> Tengah
        </button>
        <button class="btn" id="btnReset">
          <i class="fas fa-eraser"></i> Reset Peta
        </button>
      </div>
      <div class="btn-row">
        <button class="btn" id="btnFullscreen">
          <i class="fas fa-expand"></i> Fullscreen
        </button>
      </div>
    </div>

    <div class="map-wrapper">
      <div id="map"></div>
      <div class="map-controls">
        <button class="map-btn" id="btnZoomIn" title="Zoom In"><i class="fas fa-plus"></i></button>
        <button class="map-btn" id="btnZoomOut" title="Zoom Out"><i class="fas fa-minus"></i></button>
        <button class="map-btn" id="btnToggleSidebar" title="Panel Info"><i class="fas fa-list"></i></button>
      </div>
      <div class="floating-status">
        <div>
          <div class="status-label">Posisi</div>
          <div class="status-value" id="floatPos">--</div>
        </div>
        <div>
          <div class="status-label">Sinyal</div>
          <div class="status-value" id="floatSignal">--</div>
        </div>
        <div>
          <div class="status-label">Jarak</div>
          <div class="status-value" id="floatDistance">--</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/mqtt@5.0.0/dist/mqtt.min.js"></script>
  
  <script>
    // ========== MQTT CONFIG ==========
    const MQTT_CONFIG = {
      broker: 'wss://broker.emqx.io:8084/mqtt',
      topic: 'gps/tracker/data'
    };

    // ========== MAP SETUP ==========
    const map = L.map('map').setView([-7.9451, 112.6155], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Custom Marker dengan animasi pulse (tanpa garis)
    const trackerIcon = L.divIcon({
      className: 'gps-marker',
      html: '<div style="width:16px;height:16px;background:#2563eb;border-radius:50%;border:2px solid white;"></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    let marker = L.marker([-7.9451, 112.6155], { icon: trackerIcon }).addTo(map);
    let lastMsgTime = 0;
    let mqttClient = null;
    let lastLatLng = null;

    // DOM Elements
    const el = {
      lat: document.getElementById('lat'),
      lng: document.getElementById('lng'),
      altitude: document.getElementById('altitude'),
      direction: document.getElementById('direction'),
      lastUpdate: document.getElementById('lastUpdate'),
      hdop: document.getElementById('hdop'),
      statSat: document.getElementById('statSat'),
      statSpeed: document.getElementById('statSpeed'),
      floatPos: document.getElementById('floatPos'),
      floatSignal: document.getElementById('floatSignal'),
      floatDistance: document.getElementById('floatDistance'),
      statusDot: document.getElementById('statusDot'),
      statusText: document.getElementById('statusText'),
      connectedNotice: document.getElementById('connectedNotice')
    };

    // Format koordinat
    function fmtCoord(val, isLat) {
      const abs = Math.abs(val).toFixed(6);
      const dir = isLat ? (val >= 0 ? 'N' : 'S') : (val >= 0 ? 'E' : 'W');
      return `${abs}° ${dir}`;
    }

    // Format waktu lokal (NTP / sistem)
    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
    }

    // Update last update dengan waktu NTP
    function updateLastUpdateTime() {
      el.lastUpdate.textContent = getCurrentTime();
    }

    // Animasi marker bergerak halus (tanpa garis trail)
    function animateMarkerTo(lat, lng) {
      const start = marker.getLatLng();
      const duration = 400;
      const startTime = performance.now();
      
      function animateStep(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        
        marker.setLatLng([
          start.lat + (lat - start.lat) * ease,
          start.lng + (lng - start.lng) * ease
        ]);
        
        if (progress < 1) {
          requestAnimationFrame(animateStep);
        }
      }
      requestAnimationFrame(animateStep);
    }

    // Update UI dengan data dari ESP32
    function updateUI(data) {
      const { lat, lng, altitude = 0, speed = 0, direction = 0, satellites = 0, hdop = 99.9, distance_cm = -1 } = data;

      // Update koordinat jika valid
      if (lat !== 0 && lng !== 0) {
        el.lat.textContent = fmtCoord(lat, true);
        el.lng.textContent = fmtCoord(lng, false);
        el.floatPos.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        
        // Animasi marker ke posisi baru
        animateMarkerTo(lat, lng);
        
        // Pan map hanya jika jarak perpindahan cukup jauh (> 50 meter)
        if (lastLatLng) {
          const distance = map.distance(lastLatLng, { lat, lng });
          if (distance > 50) {
            map.panTo([lat, lng]);
          }
        } else {
          map.panTo([lat, lng]);
        }
        
        lastLatLng = { lat, lng };
      } else {
        el.lat.innerHTML = '<span class="info-unit">Waiting for GPS...</span>';
        el.lng.innerHTML = '<span class="info-unit">Waiting for GPS...</span>';
        el.floatPos.textContent = 'No GPS signal';
      }

      // Update data lainnya
      el.altitude.textContent = altitude.toFixed(1);
      el.direction.textContent = direction.toFixed(0);
      el.hdop.textContent = hdop.toFixed(1);
      el.statSat.textContent = satellites;
      el.statSpeed.textContent = speed.toFixed(0);
      el.floatSignal.textContent = satellites > 0 ? `${satellites} sat` : 'No GPS';

      // Update jarak ultrasonic
      if (distance_cm !== undefined && distance_cm > 0) {
        el.floatDistance.textContent = `${distance_cm} cm`;
      } else if (distance_cm === -1) {
        el.floatDistance.textContent = 'Out of range';
      } else {
        el.floatDistance.textContent = '--';
      }

      // Update status koneksi
      el.statusDot.classList.add('connected');
      el.statusText.textContent = 'Menerima data dari ESP32';
      el.connectedNotice.style.display = 'block';
      
      // Update waktu terakhir dengan NTP (waktu lokal browser)
      updateLastUpdateTime();
      
      lastMsgTime = Date.now();
    }

    // Update waktu setiap detik (live clock)
    setInterval(() => {
      if (lastMsgTime > 0) {
        updateLastUpdateTime();
      }
    }, 1000);

    // ========== MQTT CONNECTION ==========
    async function connectMQTT() {
      try {
        el.statusText.textContent = 'Menghubungkan ke MQTT...';
        el.statusDot.style.background = '#f59e0b';
        
        console.log('🔗 Connecting to MQTT broker...');
        
        mqttClient = await mqtt.connectAsync(MQTT_CONFIG.broker, {
          clientId: 'web_dashboard_' + Math.random().toString(16).slice(2, 10),
          clean: true,
          connectTimeout: 10000,
          reconnectPeriod: 3000
        });
        
        console.log('✅ MQTT Connected!');
        
        await mqttClient.subscribeAsync(MQTT_CONFIG.topic, { qos: 1 });
        console.log(`📡 Subscribed to: ${MQTT_CONFIG.topic}`);
        el.statusText.textContent = 'Menunggu data ESP32...';
        el.statusDot.classList.add('connected');
        
        mqttClient.on('message', (topic, message) => {
          try {
            const data = JSON.parse(message.toString());
            console.log('📥 Data dari ESP32:', data);
            updateUI(data);
          } catch(e) {
            console.error('❌ Parse error:', e);
          }
        });
        
        mqttClient.on('close', () => {
          console.warn('🔌 MQTT connection closed');
          el.statusText.textContent = 'Koneksi putus, reconnect...';
          el.statusDot.classList.remove('connected');
          el.connectedNotice.style.display = 'none';
        });
        
        mqttClient.on('error', (err) => {
          console.error('❌ MQTT Error:', err);
          el.statusText.textContent = 'Error, reconnect...';
          el.statusDot.style.background = '#f59e0b';
        });
        
      } catch (err) {
        console.error('❌ MQTT Connection failed:', err);
        el.statusText.textContent = 'Koneksi gagal, coba lagi...';
        el.statusDot.style.background = '#ef4444';
        setTimeout(connectMQTT, 5000);
      }
    }

    // ========== EVENT LISTENERS ==========
    document.getElementById('btnCenter').addEventListener('click', () => {
      if (lastLatLng) {
        map.panTo(lastLatLng);
      } else {
        map.panTo(marker.getLatLng());
      }
    });
    
    document.getElementById('btnReset').addEventListener('click', () => {
      // Reset peta ke view default
      map.setView([-7.9451, 112.6155], 16);
    });
    
    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });
    
    document.getElementById('btnZoomIn').addEventListener('click', () => map.zoomIn());
    document.getElementById('btnZoomOut').addEventListener('click', () => map.zoomOut());
    document.getElementById('btnToggleSidebar').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });
    document.getElementById('btnCloseSidebar').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('open');
    });
    document.getElementById('map').addEventListener('click', (e) => {
      if (e.target.id === 'map') {
        document.getElementById('sidebar').classList.remove('open');
      }
    });

    // Start connection
    window.addEventListener('load', () => {
      console.log('🚀 Starting MQTT connection...');
      connectMQTT();
    });

    // Heartbeat check
    setInterval(() => {
      if (lastMsgTime > 0 && Date.now() - lastMsgTime > 15000) {
        el.floatSignal.textContent = '⚠️ No data';
        el.statusText.textContent = 'Tidak ada data dari ESP32';
        el.statusDot.style.background = '#f59e0b';
      }
    }, 5000);
  </script>
</body>
</html>
